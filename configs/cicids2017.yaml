# CIC-IDS2017 - SECOND / cross-dataset benchmark
# Download: https://www.unb.ca/cic/datasets/ids-2017.html
# Put the 8 MachineLearningCVE/*.pcap_ISCX.csv files under data/raw/cicids2017/
data:
  dataset: cicids2017
  root: data/raw/cicids2017
  cache_dir: data/processed
  max_rows: 300000          # full set is ~2.8M flows across 8 CSVs
  balance: undersample
  binary: true              # false -> 10-way multiclass over attack_cat
  min_class_count: 500
  scaler: quantile
  select_k: 40            # CIC has 78 raw numeric features
  reducer: pca
  n_features: 8             # == n_qubits
  test_size: 0.2
  val_size: 0.1
  seed: 42
  n_jobs: -1

encoding:
  scheme: phase             # phase | rate | latency | delta | repeat
                            # phase/delta are deterministic and retain ~96-98% of the
                            # raw-feature AUC at T=8-12; Bernoulli 'rate' coding loses
                            # ~18% at T=8 and needs T>=128 to catch up.
  timesteps: 12
  gain: 1.0
  tau: 3.0
  deterministic: false
  seed: 42

model:
  n_qubits: 8
  n_qlif_layers: 2
  ansatz_layers: 2
  ansatz: strong            # strong | basic | ring (ring = most NISQ-friendly)
  beta: 0.90
  learn_beta: true
  threshold: 0.55
  learn_threshold: false
  reset: subtract
  angle_map: sigmoid       # sigmoid = monotone (required); tanh = symmetric ablation
  angle_gain: 2.0
  angle_bias: -2.0
  surrogate: fast_sigmoid
  surrogate_alpha: 5.0
  readout: rate_mem_prob
  dropout: 0.1
  n_classes: 2
  diff_method: backprop

noise:
  enabled: false            # flip to true (or pass --noise) for the robustness run
  backend: analytic         # analytic | qiskit_aer | ibm_runtime
  depolarizing: 0.01
  amplitude_damping: 0.005
  phase_damping: 0.0
  readout_error: 0.0
  shots: null
  ibm_backend: ibm_brisbane

train:
  epochs: 30
  batch_size: 256           # PennyLane vectorises over the batch: 256 is ~1.7x
                            # faster per sample than 64, and 512 is ~2.4x. Raise it
                            # as far as RAM allows before touching anything else.
  lr: 0.003
  quantum_lr: 0.01
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  loss: focal
  focal_gamma: 2.0
  grad_clip: 1.0
  patience: 8
  device: auto
  num_workers: 0
  amp: false
  log_every: 50
  out_dir: artifacts
  run_name: qsnn_cicids2017
  save_best: true
  seed: 42

baselines:
  enabled: [rf, svm, mlp, qsvc, qcnn]
  # WARNING: the quantum kernel is O(n^2) circuits at ~9 ms each.
  #   500 -> ~0.6 h | 1000 -> ~2.5 h | 2000 -> ~10 h (blows a free-tier session)
  # 'n_train_used' is recorded in the results so the subset size stays transparent.
  qsvc_max_train: 500
  qsvc_reps: 2
  qcnn_epochs: 20
